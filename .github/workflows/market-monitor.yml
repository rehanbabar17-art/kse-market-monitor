name: KSE Market Monitor

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode (interval, summary, or auto)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - interval
          - summary
      force:
        description: "Skip market hours check"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
  B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
  B2_BUCKET: ${{ secrets.B2_BUCKET }}
  B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r kse-monitor/requirements.txt

      - name: Restore EOD state from B2
        env:
          B2_COMMAND: download
        run: python kse-monitor/b2_sync.py

      - name: Determine run mode
        id: mode
        run: |
          echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "force=--force" >> $GITHUB_OUTPUT
          else
            echo "force=" >> $GITHUB_OUTPUT
          fi

      - name: Run KSE Monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          cd kse-monitor
          python main.py --mode ${{ steps.mode.outputs.mode }} ${{ steps.mode.outputs.force }}

      - name: Upload EOD state to B2
        if: always()
        env:
          B2_COMMAND: upload
        run: python kse-monitor/b2_sync.py

      - name: Secure cleanup of local private state
        if: always()
        run: rm -f kse-monitor/state/last_eod.json
