name: KSE Market Monitor

on:
  schedule:
    - cron: "0 4-12 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode (interval, summary, or auto)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - interval
          - summary
      force:
        description: "Skip market hours check"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
  B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
  B2_BUCKET: ${{ secrets.B2_BUCKET }}
  B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
  B2_CONFIG_FILE: /tmp/kse-monitor-config.yaml
  B2_STATE_FILE: /tmp/kse-monitor-last_eod.json
  KSE_STATE_FILE: /tmp/kse-monitor-last_eod.json

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r kse-monitor/requirements.txt

      - name: Restore monitor configuration and state from B2
        env:
          B2_COMMAND: download
        run: python kse-monitor/b2_sync.py

      - name: Determine run mode
        id: mode
        run: |
          mode="${{ inputs.mode }}"
          if [ -z "$mode" ]; then mode="auto"; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "force=--force" >> "$GITHUB_OUTPUT"
          else
            echo "force=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run KSE Monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python kse-monitor/main.py --config "$B2_CONFIG_FILE" --mode "${{ steps.mode.outputs.mode }}" ${{ steps.mode.outputs.force }}

      - name: Upload monitor configuration and state to B2
        if: always()
        env:
          B2_COMMAND: upload
        run: python kse-monitor/b2_sync.py

      - name: Secure cleanup of ephemeral B2 files
        if: always()
        run: rm -f "$B2_CONFIG_FILE" "$B2_STATE_FILE"
