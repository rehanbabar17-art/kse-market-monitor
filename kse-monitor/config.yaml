# ============================================================
# KSE Monitor Configuration
# ============================================================

# ntfy notification settings (set via NTFY_TOPIC GitHub secret)
ntfy:
  server: "https://ntfy.sh"
  topic: "${NTFY_TOPIC}"

# Market timezone
market:
  timezone: "Asia/Karachi"

# Trading windows — list of [open, close] pairs per weekday (PKT hours)
# Monday–Thursday: one session
# Friday: two sessions with a break for Jumma prayers
trading_windows:
  mon:
    - [9, 17]
  tue:
    - [9, 17]
  wed:
    - [9, 17]
  thu:
    - [9, 17]
  fri:
    - [9, 13]     # morning session (until Jumma break)
    - [14, 17]    # afternoon session (after Jumma break)

# Your listed PSX stocks
stocks:
  - symbol: "MLCF-SEP"
    name: "Maple Leaf Cement Futures"
  - symbol: "HTL"
    name: "HTL"
  - symbol: "YOUW"
    name: "YOUW"
  - symbol: "BIPL"
    name: "BankIslami Pakistan"
  - symbol: "PTC"
    name: "Pakistan Telecommunication Company"
  - symbol: "HASCOL"
    name: "Hascol Petroleum Limited"
